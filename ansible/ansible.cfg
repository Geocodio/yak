# Read when ansible-playbook runs from this directory (the documented way to deploy).
# It holds connection speed-ups only: no inventory or vault settings, so ansible-vault
# and explicit -i / --vault-password-file flags behave the same from here.
[defaults]
# Facts are cached for a day, so later runs skip the fact-gathering round trips.
gathering = smart
fact_caching = jsonfile
fact_caching_connection = ~/.ansible/fact-cache
fact_caching_timeout = 86400
interpreter_python = auto_silent

[ssh_connection]
# One SSH round trip per task instead of several, over one reused connection.
pipelining = true
ssh_args = -o ControlMaster=auto -o ControlPersist=600s -o PreferredAuthentications=publickey -o ServerAliveInterval=30
