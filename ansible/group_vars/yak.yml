---
yak_user: yak
yak_home: /home/yak
yak_repo_path: /home/yak/repos
yak_data_path: /home/yak/data
yak_claude_path: /home/yak/.claude
yak_logs_path: /home/yak/logs
yak_container_name: yak

swap_size_mb: 4096

# Branch deployments: DNS-01 wildcard TLS
# Set caddy_dns_provider to one of Caddy's supported providers (cloudflare, route53, etc.)
# Leave empty/undefined to keep the dashboard-only Caddyfile. Requires setting
# caddy_dns_provider_api_token in the vault.
caddy_dns_provider: cloudflare

ufw_allowed_ports:
  - "22"
  - "80"
  - "443"

mariadb_container_name: yak-mariadb
mariadb_data_path: /home/yak/mariadb-data
redis_container_name: yak-redis
# Thread stream contents live here, so it sits outside /home/yak and is mode 0700.
redis_data_path: /var/lib/yak/redis
redis_container_uid: 999
redis_container_gid: 1000
redis_config_path: /home/yak/redis.conf
redis_maxmemory: 1gb
yak_broker_user: yak-broker
yak_broker_uid: 991
yak_broker_gid: 991
yak_credentials_path: /var/lib/yak/credentials
yak_auth_proxy_address: 10.100.0.1:8787
# The Incus sandbox bridge (yak-sandbox); the auth proxy listens on its gateway address.
yak_sandbox_subnet: 10.100.0.0/24
yak_auth_proxy_host_cidrs: 172.16.0.0/12
# The Yak container is the only member of this network and is its egress network, so the auth proxy sees this source address.
yak_app_network_name: yak-app
yak_app_network_subnet: 172.30.0.0/29
yak_container_address: 172.30.0.2
# uid of www-data inside the Yak container, the peer allowed on the credential socket.
yak_container_www_data_uid: 33
telemetryd_container_name: yak-telemetryd
telemetryd_data_path: /home/yak/telemetryd-data
telemetryd_image_tag: "0.72.2"
telemetryd_disk_budget: "10GiB"
telemetryd_memory_limit: "1g"

# Incus sandbox settings
# incus_zfs_device: /dev/sdb  # Uncomment and set to a dedicated disk for best performance
incus_zfs_pool_size: 250G     # Only used when no dedicated disk (file-backed pool)
incus_zfs_arc_max: "8589934592"  # 8GB ZFS ARC cache (tune based on total RAM)

# Incus release series the host is pinned to.
incus_version_pin: "7.6"

# yak-base image version. Bump this whenever the base template build
# changes in a way repo templates need to inherit (new packages, swapped
# browser engine, etc.). MUST match `yak.sandbox.base_version` in
# config/yak.php — the app reads that config value and invalidates repo
# templates whose stored `sandbox_base_version` is older.
# 4: playwright 1.62.1 pinned + PLAYWRIGHT_BROWSERS_PATH, required by `yak-browser shoot`.
# 5: PHP 8.5 from ppa:ondrej/php (patched for CVE-2026-109618 and CVE-2026-109619).
yak_sandbox_base_version: 5

# Hard ceiling for yak:drain before a container recreate: every in-flight
# task (Running or Retrying) is force-failed once this many seconds have
# elapsed, regardless of activity. Agent tasks routinely run 30-40
# minutes, so this is deliberately generous — a deploy can block for up
# to this long rather than destroy live work. --wait keeps its shorter
# meaning: the minimum patience for a task that's gone silent.
yak_drain_max_wait_seconds: 2700
