---
- name: Assert the internal token is set
  ansible.builtin.assert:
    that:
      - yak_ssh_internal_token | length > 0
    fail_msg: yak_ssh_internal_token must be set in the vault

- name: Ensure /etc/yak directory exists
  ansible.builtin.file:
    path: /etc/yak
    state: directory
    mode: "0711"
    owner: root
    group: root

- name: Create the jump, lookup and bridge groups
  ansible.builtin.group:
    name: "{{ item }}"
    system: true
  loop:
    - "{{ yak_ssh_jump_user }}"
    - "{{ yak_ssh_lookup_user }}"
    - "{{ yak_ssh_bridge_user }}"

- name: Create the jump, lookup and bridge users
  ansible.builtin.user:
    name: "{{ item }}"
    group: "{{ item }}"
    system: true
    create_home: false
    shell: /usr/sbin/nologin
  loop:
    - "{{ yak_ssh_jump_user }}"
    - "{{ yak_ssh_lookup_user }}"
    - "{{ yak_ssh_bridge_user }}"

# Always built on the controller (cached, so fast): a stale broker/dist binary is never installed.
- name: Build the ssh binaries on the controller
  ansible.builtin.command:
    cmd: go build -o {{ playbook_dir }}/../broker/dist/{{ item.binary }} ./{{ item.package }}
    chdir: "{{ playbook_dir }}/../broker"
  environment:
    CGO_ENABLED: "0"
    GOOS: linux
    GOARCH: amd64
  delegate_to: localhost
  become: false
  changed_when: false
  run_once: true
  loop:
    - { binary: yak-wakeproxy, package: wakeproxy }
    - { binary: yak-termbridge, package: termbridge }
    - { binary: yak-ssh-lookup, package: sshlookup }

- name: Create the ssh binary directory
  ansible.builtin.file:
    path: "{{ yak_ssh_bin_dir }}"
    state: directory
    mode: "0755"
    owner: root
    group: root

- name: Install the wake proxy binary
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../broker/dist/yak-wakeproxy"
    dest: "{{ yak_ssh_bin_dir }}/yak-wakeproxy"
    mode: "0755"
    owner: root
    group: root
  notify: Restart yak-wake

- name: Install the terminal bridge binary
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../broker/dist/yak-termbridge"
    dest: "{{ yak_ssh_bin_dir }}/yak-termbridge"
    mode: "0755"
    owner: root
    group: root
  notify: Restart yak-termbridge

- name: Install the key lookup binary
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../broker/dist/yak-ssh-lookup"
    dest: "{{ yak_ssh_bin_dir }}/yak-ssh-lookup"
    mode: "0755"
    owner: root
    group: root

# Each service reads its own copy, so no token file is shared between users.
- name: Write the internal token files
  ansible.builtin.copy:
    dest: "/etc/yak/ssh-token-{{ item.name }}"
    content: "{{ yak_ssh_internal_token }}\n"
    owner: "{{ item.owner }}"
    group: "{{ item.owner }}"
    mode: "0600"
  no_log: true
  loop:
    - { name: wake, owner: "{{ yak_ssh_broker_user }}" }
    - { name: lookup, owner: "{{ yak_ssh_lookup_user }}" }
    - { name: termbridge, owner: "{{ yak_ssh_bridge_user }}" }

- name: Write the service environment files
  ansible.builtin.template:
    src: yak-ssh.env.j2
    dest: "/etc/yak/ssh-{{ item }}.env"
    owner: root
    group: root
    mode: "0644"
  vars:
    yak_ssh_env_for: "{{ item }}"
  loop:
    - wake
    - termbridge
  notify:
    - Restart yak-wake
    - Restart yak-termbridge

- name: Install the key lookup wrapper
  ansible.builtin.template:
    src: yak-ssh-lookup.sh.j2
    dest: /usr/local/bin/yak-ssh-lookup
    owner: root
    group: root
    mode: "0755"

# The wake proxy binds one 127.16.0.0/10 address per sandbox on port 22. A host sshd on 0.0.0.0:22
# owns every loopback address there, so the bind fails and a terminal reaches the host's sshd.
# The drop-in pins it to the public IPv4 address; the IPv6 wildcard does not overlap IPv4 loopback.
- name: Keep the host sshd off the sandbox wake addresses
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/10-yak-listen.conf
    content: |
      ListenAddress {{ yak_ssh_host_listen_address }}
      ListenAddress ::
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart host sshd

- name: Create the jump sshd config directory
  ansible.builtin.file:
    path: "{{ yak_ssh_config_dir }}"
    state: directory
    mode: "0755"
    owner: root
    group: root

- name: Generate the jump host key
  ansible.builtin.command:
    cmd: ssh-keygen -q -t ed25519 -N "" -f {{ yak_ssh_config_dir }}/ssh_host_ed25519_key
    creates: "{{ yak_ssh_config_dir }}/ssh_host_ed25519_key"

- name: Install the jump sshd config
  ansible.builtin.template:
    src: yak-jump-sshd.conf.j2
    dest: "{{ yak_ssh_config_dir }}/sshd_config"
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart yak-jump-sshd

- name: Install the systemd units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - yak-jump-sshd.service
    - yak-wake.service
    - yak-termbridge.service
  notify:
    - Reload systemd (yak-ssh)
    - Restart yak-jump-sshd
    - Restart yak-wake
    - Restart yak-termbridge

- name: Flush handlers so systemd sees the new units
  ansible.builtin.meta: flush_handlers

- name: Enable and start the jump sshd, wake proxy and terminal bridge
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - yak-jump-sshd
    - yak-wake
    - yak-termbridge

# The wake listeners (127.0.0.0/8) and the bridge (loopback) need no firewall rule.
- name: Allow the jump host port
  community.general.ufw:
    rule: allow
    direction: in
    to_port: "{{ yak_ssh_jump_port }}"
    proto: tcp
    comment: "Yak ssh jump host"
