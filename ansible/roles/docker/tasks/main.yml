---
- name: Install Docker prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
    state: present

- name: Create keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Download Docker GPG key
  ansible.builtin.get_url:
    url: "https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg"
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Add Docker repository
  ansible.builtin.apt_repository:
    repo: "deb [arch={{ ansible_architecture | replace('x86_64', 'amd64') }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/{{ ansible_distribution | lower }} {{ ansible_distribution_release }} stable"
    state: present

- name: Install Docker Engine and Compose
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Add yak user to docker group
  ansible.builtin.user:
    name: "{{ yak_user }}"
    groups: docker
    append: true

# Docker sets the iptables FORWARD policy to DROP every time it starts, which
# cuts the Incus sandboxes off the internet until ufw reloads. UFW owns the
# forward policy on this host.
- name: Keep Docker from changing the FORWARD policy
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    content: |
      {
        "ip-forward-no-drop": true
      }
    mode: "0644"
  register: docker_daemon_config

- name: Enable and start Docker
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: "{{ 'restarted' if docker_daemon_config.changed else 'started' }}"

- name: Prune old Docker images nightly
  ansible.builtin.cron:
    name: "Prune untagged Docker images"
    minute: "0"
    hour: "4"
    job: "docker image prune -f --filter until=24h > /dev/null 2>&1"
