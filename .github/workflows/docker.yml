name: Docker

on:
  push:
    branches:
      - main
    # A push that changes only the iOS app builds no image and starts no deployment.
    paths-ignore:
      - 'ios/**'
      - '.github/workflows/ios*.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            geocodio/yak:latest
            geocodio/yak:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # An install with a private deployment repository sets the DEPLOY_REPOSITORY variable
      # (owner/name) and a GitHub App installed only on that repository, through the
      # DEPLOY_APP_ID and DEPLOY_APP_PRIVATE_KEY secrets. The app needs Contents: write there to
      # receive repository_dispatch. That repository then deploys geocodio/yak:<sha>.
      # Without them, nothing is sent.
      - name: Check for a deployment repository
        id: deployment
        if: github.ref == 'refs/heads/main'
        env:
          DEPLOY_REPOSITORY: ${{ vars.DEPLOY_REPOSITORY }}
          DEPLOY_APP_ID: ${{ secrets.DEPLOY_APP_ID }}
        run: |
          if [ -n "$DEPLOY_REPOSITORY" ] && [ -n "$DEPLOY_APP_ID" ]; then
            echo "owner=${DEPLOY_REPOSITORY%%/*}" >> "$GITHUB_OUTPUT"
            echo "name=${DEPLOY_REPOSITORY#*/}" >> "$GITHUB_OUTPUT"
          else
            echo "No deployment repository configured."
          fi

      - name: Mint a token for the deployment repository
        id: token
        if: steps.deployment.outputs.name != ''
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.DEPLOY_APP_ID }}
          private-key: ${{ secrets.DEPLOY_APP_PRIVATE_KEY }}
          owner: ${{ steps.deployment.outputs.owner }}
          repositories: ${{ steps.deployment.outputs.name }}

      - name: Trigger the deployment
        if: steps.deployment.outputs.name != ''
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          DEPLOY_REPOSITORY: ${{ vars.DEPLOY_REPOSITORY }}
        run: gh api "repos/$DEPLOY_REPOSITORY/dispatches" -f event_type=yak-image-built -f "client_payload[sha]=$GITHUB_SHA"
