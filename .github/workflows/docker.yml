name: Docker

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            geocodio/yak:latest
            geocodio/yak:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # An install with a private deployment repository sets DEPLOY_REPOSITORY (a repository variable)
      # and DEPLOY_DISPATCH_TOKEN (a secret that may send repository_dispatch there). That repository
      # then deploys geocodio/yak:<sha>. Without both, nothing is sent.
      - name: Trigger the deployment
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_DISPATCH_TOKEN }}
          DEPLOY_REPOSITORY: ${{ vars.DEPLOY_REPOSITORY }}
        run: |
          if [ -z "$GH_TOKEN" ] || [ -z "$DEPLOY_REPOSITORY" ]; then
            echo "No deployment repository configured."
            exit 0
          fi
          gh api "repos/$DEPLOY_REPOSITORY/dispatches" -f event_type=yak-image-built -f "client_payload[sha]=$GITHUB_SHA"
