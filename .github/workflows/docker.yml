name: Docker

on:
  push:
    branches:
      - main
      - feat/next-gen

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            geocodio/yak:latest
            geocodio/yak:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The next-gen trial server pulls these tags; :latest stays on main.
      - name: Build and push next-gen
        if: github.ref == 'refs/heads/feat/next-gen'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            geocodio/yak:next-gen
            geocodio/yak:next-gen-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
