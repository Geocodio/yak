name: runner

on:
  pull_request:
    paths:
      - 'runner/**'
      - '.github/workflows/runner.yml'
  push:
    branches:
      - develop
      - main
      - master
    paths:
      - 'runner/**'
      - '.github/workflows/runner.yml'

jobs:
  runner:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runner

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: runner/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test
