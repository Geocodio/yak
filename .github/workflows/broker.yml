name: broker

on:
  pull_request:
    paths:
      - 'broker/**'
      - '.github/workflows/broker.yml'
  push:
    branches:
      - develop
      - main
      - master
    paths:
      - 'broker/**'
      - '.github/workflows/broker.yml'

jobs:
  broker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: broker

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: broker/go.mod
          cache-dependency-path: broker/go.sum

      - name: Vet
        run: go vet ./...

      - name: Format check
        run: test -z "$(gofmt -l .)"

      - name: Test
        run: go test -race ./...
