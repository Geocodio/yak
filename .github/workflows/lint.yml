name: linter

on:
  push:
    branches:
      - develop
      - main
      - master
  pull_request:
    branches:
      - develop
      - main
      - master

jobs:
  linter:
    runs-on: ubuntu-latest
    environment: Testing
    steps:
      - uses: actions/checkout@v6

      - name: Setup app
        uses: ./.github/actions/setup-php-app
        with:
          flux-username: ${{ secrets.FLUX_USERNAME }}
          flux-license-key: ${{ secrets.FLUX_LICENSE_KEY }}

      - name: Pint
        run: vendor/bin/pint --test

      - name: PHPStan
        run: vendor/bin/phpstan analyse --memory-limit=2G

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      # Composer first: package.json installs @cboxdk/telemetry-ui from vendor/.
      - name: Install Node dependencies
        run: npm ci

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: broker/go.mod
          cache-dependency-path: |
            broker/go.sum
            cli/go.sum

      - name: gofmt
        run: |
          unformatted="$(gofmt -l broker cli)"
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: |
          (cd broker && go vet ./...)
          (cd cli && go vet ./...)
