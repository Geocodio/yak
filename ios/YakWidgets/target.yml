targets:
  YakWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: YakWidgets
      - path: Shared/LiveActivity
    dependencies:
      - package: YakKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(YAK_BUNDLE_ID).widgets
        PRODUCT_NAME: YakWidgets
        CODE_SIGN_ENTITLEMENTS: YakWidgets/YakWidgets.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: $(YAK_DISPLAY_NAME)
        SKIP_INSTALL: YES
    info:
      path: YakWidgets/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  Yak:
    dependencies:
      - target: YakWidgets
        embed: true
    settings:
      configs:
        Debug:
          YAK_PUSH_ENVIRONMENT: sandbox
          YAK_APS_ENVIRONMENT: development
        Release:
          YAK_PUSH_ENVIRONMENT: production
          YAK_APS_ENVIRONMENT: production
