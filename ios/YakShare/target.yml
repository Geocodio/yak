targets:
  YakShare:
    type: app-extension
    platform: iOS
    sources:
      - path: YakShare
      - path: Shared/Storage
      - path: Shared/Uploads
      - path: Shared/Share
      - path: Yak/Composer/AttachmentPreparer.swift
    dependencies:
      - package: YakKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(YAK_BUNDLE_ID).share
        PRODUCT_NAME: YakShare
        CODE_SIGN_ENTITLEMENTS: YakShare/YakShare.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: $(YAK_DISPLAY_NAME)
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    info:
      path: YakShare/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        YakAppGroup: $(YAK_APP_GROUP)
        YakAppBundleID: $(YAK_BUNDLE_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsImageWithMaxCount: 50
              NSExtensionActivationSupportsWebURLWithMaxCount: 5
              NSExtensionActivationSupportsText: true
  Yak:
    dependencies:
      - target: YakShare
        embed: true
